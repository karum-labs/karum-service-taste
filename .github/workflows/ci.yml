name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Qloo fixture pack lives in the sibling infra repo, which is
      # private. Checking it out lets pack-dependent tests run for real
      # instead of skipping. The default token cannot read a private sibling,
      # so the step is allowed to fail: without FIXTURE_REPO_TOKEN the pack
      # tests skip, and with it they are required.
      - name: Checkout karum-infra (fixture pack)
        id: infra
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: karum-labs/karum-infra
          path: _infra
          # The default token reads public repos; set FIXTURE_REPO_TOKEN if
          # karum-infra is still private.
          token: ${{ secrets.FIXTURE_REPO_TOKEN || github.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # Enable the uv cache to speed up dependency installs.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        env:
          TASTE_FIXTURES_DIR: ${{ github.workspace }}/_infra/fixtures
          # The pack is required when it was checked out; without the sibling
          # the pack tests skip rather than fail.
          TASTE_REQUIRE_FIXTURES: ${{ steps.infra.outcome == 'success' && '1' || '0' }}
        run: uv run pytest
